# herdr-review configuration.
# Copy to ${XDG_CONFIG_HOME:-~/.config}/herdr-review/config.yaml and chmod 600.
# The plugin never edits this file.
#
# Every profile carries two `args` lines, one of them commented out:
#   auto mode — the CLI's own classifier or sandbox judges each action; what it does not allow
#               becomes a dialog in the agent's tab, and the orchestrator answers it;
#   yolo mode — every action is approved in advance.
# Auto mode is active below; swap the comments per profile where the review runs on a throwaway
# VM or container. The agents write into settings.runs_dir, outside the repository: `--add-dir`
# (claude, codex) declares that directory writable — the codex sandbox refuses the write without
# it, claude only asks its classifier more often. Both CLIs expand the `~`. grok has no such flag
# and needs none. gemini has no auto mode: `--approval-mode auto_edit` still asks about every
# shell command, so its profile stays yolo. The auto mode flags need Claude Code >= 2.1.111 (auto
# mode is also gated by the subscription plan) and Codex >= 0.147.0; an older CLI rejects the flag
# and that agent leaves the run as failed.
#
# Every profile of kind claude starts with the session-only --settings
# '{"enableAllProjectMcpServers": true, "attribution": {"commit": ""}}'. With the first key Claude
# Code loads the project's .mcp.json servers without its approval dialog, whose every answer would
# be saved into the repository's .claude/settings.local.json; the second, attribution.commit set to
# "", keeps Claude Code's trailer out of the fix commits. A profile that passes its own --settings
# gets nothing added and must carry those keys in its settings file itself.

profiles:                        # one mechanism for every engine: herdr kind + CLI args + env
  claude-opus:
    kind: claude                 # herdr agent kind; the executable must be in PATH
    args: [--model, opus, --permission-mode, auto, --add-dir, "~/.local/state/herdr-review/runs"]
    # args: [--model, opus, --dangerously-skip-permissions]
  claude-fable:
    kind: claude
    args: [--model, fable, --permission-mode, auto, --add-dir, "~/.local/state/herdr-review/runs"]
    # args: [--model, fable, --dangerously-skip-permissions]
  codex:
    kind: codex
    args: [-m, gpt-5.5, -c, model_reasoning_effort=high, --approve-for-me, --add-dir, "~/.local/state/herdr-review/runs"]
    # args: [-m, gpt-5.5, -c, model_reasoning_effort=high, --dangerously-bypass-approvals-and-sandbox]
  gemini:
    kind: gemini
    args: [-m, gemini-3-pro, --yolo]   # no auto mode in gemini, see above
  grok:
    kind: grok
    args: [-m, grok-4.6, --permission-mode, auto]
    # args: [-m, grok-4.6, --always-approve]
  # glm:                         # an alt-provider model is the same claude kind plus env
  #   kind: claude
  #   env:                       # secrets go here, never in args: args are copied verbatim into
  #                              # run.json and into runner.log, and neither masks them
  #     ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
  #     ANTHROPIC_AUTH_TOKEN: "${ZAI_TOKEN}"   # ${VAR} expands from the launcher's environment
  #   args: [--model, glm-5, --dangerously-skip-permissions]
  #   # args: [--model, glm-5, --permission-mode, auto, --add-dir, "~/.local/state/herdr-review/runs"]
  #   #                          # the classifier is a model call too: untested behind another provider

presets:
  default:                       # used by `herdr-review launch` without --preset
    reviewers: [claude-opus, codex, gemini, grok]
    orchestrator: claude-opus
    fixer: claude-opus

settings:
  layout: tabs                   # tabs = one tab per agent | grid = panes in the orchestrator's tab
  autodecide: false              # true = the orchestrator decides disputed issues itself
  scope: auto                    # auto = the branch's commits, else the working tree | commits | worktree
  close_agents_on_finish: false  # true = close reviewer and fixer tabs/panes at the end
  checkin_sec: 300               # how often `run wait` returns control to the orchestrator
  # runs_dir also holds the machine's build queue (exclusive.lock, exclusive.json): every review that uses this
  # runs_dir, and your own `herdr-review exclusive` calls, run their heavy commands there one at a time.
  runs_dir: ~/.local/state/herdr-review/runs   # keep the --add-dir values above in step with it; keep it outside the repository, or the run's own files count as drift
